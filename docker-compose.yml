services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sentinel_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    restart: always

  ai-brain:
    build: ./ai-brain
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000" # Expose AI Brain on 8001 to avoid conflict with Chroma
    depends_on:
      - chromadb
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    volumes:
      - ./ai-brain:/app
    restart: always
